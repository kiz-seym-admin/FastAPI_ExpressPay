services:
  api:
    build: .
    container_name: fastapi_expresspay
    ports:
      - "8000:8000"
    volumes:
      - json_data:/data                          # volume для users.json и payments.json
      - ./courses.json:/data/courses.json        # courses.json монтируется из папки проекта
    environment:
      - TZ=Europe/Minsk
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  json_data:
    driver: local
